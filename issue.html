<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Issue Details | India Awareness Hub</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body data-page="issues">
    <div class="topbar">
      <div class="container topbar-inner">
        <div class="flag-strip">
          <span class="flag"></span>
          <span data-i18n="sloganLine">Jai Hind • Bharat Mata Ki Jai • Vande Mataram</span>
        </div>
        <div id="todayDate"></div>
      </div>
    </div>

    <header class="site-header">
      <div class="container nav-wrap">
        <div class="logo-box">
          <div class="logo-mark">ॐ</div>
          <span>India Awareness Hub</span>
        </div>

        <nav class="nav-links">
          <a href="index.html" data-i18n="navHome">Home</a>
          <a href="index.html#issues" data-i18n="navIssues">Issues</a>
          <a href="index.html#facts" data-i18n="navFacts">Facts</a>
          <a href="index.html#videos" data-i18n="navVideos">Videos</a>
          <a href="index.html#constitution" data-i18n="navConstitution">Constitution</a>
          <a href="index.html#news" data-i18n="navNews">News</a>
        </nav>

        <div class="actions">
          <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
            <i class="fa-solid fa-moon"></i>
          </button>
          <button id="langToggle" class="lang-toggle" aria-label="Toggle Language">हिन्दी</button>
        </div>
      </div>
    </header>

    <main class="section detail-page">
      <div class="container">
        <div id="issueDetail"></div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <div class="footer-brand">
          <div class="foot-mark">ॐ</div>
          <span>India Awareness Hub</span>
        </div>

        <p data-i18n="footerText">“Bharat Mata Ki Jai” • “Vande Mataram” • Civic awareness for a stronger nation</p>

        <div class="socials">
          <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
          <a href="#"><i class="fa-brands fa-youtube"></i></a>
        </div>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
